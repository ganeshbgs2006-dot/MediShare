version: '3.8'

services:
  # MySQL 8.0 Relational Database
  db:
    image: mysql:8.0
    container_name: medishare-db
    restart: always
    environment:
      MYSQL_DATABASE: medishare
      MYSQL_USER: medishare_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-ChangeMeSecurePassword123!}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootSecurePass987!}
    ports:
      - "3306:3306"
    volumes:
      - medishare-db-data:/var/lib/mysql
      - ./backend/src/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medishare-network

  # Express REST API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medishare-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: medishare
      DB_USER: medishare_app
      DB_PASSWORD: ${DB_PASSWORD:-ChangeMeSecurePassword123!}
      JWT_SECRET: ${JWT_SECRET:-production_secure_jwt_secret_min_32_characters!}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - medishare-network

  # Vite React Frontend SPA (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medishare-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - medishare-network

volumes:
  medishare-db-data:
    driver: local

networks:
  medishare-network:
    driver: bridge

